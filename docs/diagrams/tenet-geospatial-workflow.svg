<rect x="275" y="266" width="650" height="22" rx="4" fill="#ffffff"/>
<text x="600" y="281" class="loop">Interactive What-If &amp; URL Loop: slider/preset/Starlink changes re-query /api/cat/scenarios/preview without altering SQLite</text>
