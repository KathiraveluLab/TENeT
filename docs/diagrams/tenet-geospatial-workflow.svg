<line x1="944.5" y1="149.0" x2="966.0" y2="149.0" stroke="#334155" stroke-width="1.8" marker-end="url(#warrow)"/>
<rect x="968.0" y="24" width="214" height="34" rx="5" fill="#7e22ce"/>
