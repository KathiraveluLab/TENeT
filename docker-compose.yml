services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    volumes:
      - ./backend:/app
    environment:
      FLASK_DEBUG: "${FLASK_DEBUG:-1}"
      FLASK_HOST: "${FLASK_HOST:-0.0.0.0}"
      FLASK_PORT: "${FLASK_PORT:-5001}"
      DB_TYPE: "${DB_TYPE:-sqlite}"
      DB_PATH: "${DB_PATH:-/app/data/tenet.db}"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/api/cat}"
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped

  frontend-tooling:
    build:
      context: ./frontend
      target: dev
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/api/cat}"
    profiles:
      - tooling
