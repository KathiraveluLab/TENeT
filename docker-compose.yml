version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
    environment:
      - DATA_DIR=/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  pipeline:
    build: ./pipeline
    volumes:
      - ./pipeline:/app
      - ./data:/data
    environment:
      - DATA_DIR=/data
    command: tail -f /dev/null
