<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="TENeT Geospatial Planning Workflow Diagram">
<defs>
  <style>
    .hdr { font: 700 12.5px "Segoe UI", Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
    .bullet { font: 400 11px "Segoe UI", Arial, sans-serif; fill: #1e293b; }
    .loop { font: italic 11px "Segoe UI", Arial, sans-serif; fill: #9a3412; text-anchor: middle; }
  </style>
  <marker id="warrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#334155" />
  </marker>
  <marker id="oarrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#c2410c" />
  </marker>
</defs>
<rect x="1" y="1" width="1198" height="318" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="18.0" y="24" width="214" height="34" rx="5" fill="#1d4ed8"/>
<text x="125.0" y="46" class="hdr">1. Context &amp; Mode</text>
